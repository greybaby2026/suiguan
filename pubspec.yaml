name: suiguan_app
description: 随管科技 - 智能工厂管理APP
publish_to: 'none'
version: 1.0.17+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  mobile_scanner: ^3.5.5
  intl: ^0.19.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.2.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  badges: ^3.1.2
  shimmer: ^3.0.0
  toastification: ^1.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
