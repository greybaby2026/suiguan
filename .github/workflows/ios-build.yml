name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing
        run: |
          # Modify project.pbxproj to disable signing
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY$$sdk=iphoneos\*$$" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' ios/Runner.xcodeproj/project.pbxproj
          # Ensure xcconfig has signing disabled
          echo 'CODE_SIGNING_ALLOWED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED=NO' >> ios/Flutter/Release.xcconfig

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee build.log
          echo "=== Checking build output ==="
          ls -la build/ios/iphoneos/ 2>/dev/null || echo "iphoneos dir missing"
          find build/ios -name "Runner.app" -type d 2>/dev/null || echo "No Runner.app found"

      - name: Package IPA
        if: success()
        run: |
          APP_DIR=$(find build/ios -name "Runner.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa
