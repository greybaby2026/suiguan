name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable code signing in project
        run: |
          python3 << 'EOF'
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('CODE_SIGNING_ALLOWED = YES', 'CODE_SIGNING_ALLOWED = NO')
          content = content.replace('CODE_SIGN_STYLE = Automatic', 'CODE_SIGN_STYLE = Manual')
          # Remove development team and signing identity
          import re
          content = re.sub(r'"CODE_SIGN_IDENTITY$$sdk=iphoneos\*$$" = "[^"]*"', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""', content)
          content = content.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer"', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = ""')
          with open(path, 'w') as f:
              f.write(content)
          print('Project signing disabled')
          EOF

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Runner.ipa
          path: Runner.ipa
