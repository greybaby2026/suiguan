name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Disable Code Signing in Project
        run: |
          /usr/libexec/PlistBuddy -c "Set :buildSettings:CODE_SIGNING_ALLOWED NO" ios/Runner.xcodeproj/project.pbxproj || true
          /usr/libexec/PlistBuddy -c "Set :buildSettings:CODE_SIGNING_REQUIRED NO" ios/Runner.xcodeproj/project.pbxproj || true
          /usr/libexec/PlistBuddy -c "Set :buildSettings:CODE_SIGN_IDENTITY ''" ios/Runner.xcodeproj/project.pbxproj || true
          echo 'CODE_SIGNING_ALLOWED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED=NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY=""' >> ios/Flutter/Release.xcconfig
          echo 'DEVELOPMENT_TEAM=""' >> ios/Flutter/Release.xcconfig

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee build.log
          if [ $? -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -i "error:" build.log | tail -20
            exit 1
          fi

      - name: Create IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Runner.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Runner.ipa
          path: build/ios/ipa/Runner.ipa
